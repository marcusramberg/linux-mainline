%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/liteon,ltr569.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lite-On LTR-569 ambient light and proximity sensor

maintainers:
  - Marcus Ramberg <marcus@means.no>

allOf:
  - $ref: ../common.yaml#

properties:
  compatible:
    const: liteon,ltr569

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Regulator that provides power to the sensor.

  proximity-near-level: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@23 {
            compatible = "liteon,ltr569";
            reg = <0x23>;
            proximity-near-level = <1500>;
        };
    };
