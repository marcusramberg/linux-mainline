%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/magnetometer/qst,qmc6308.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QST QMC6308 3-axis magnetometer

maintainers:
  - Marcus Ramberg <marcus@means.no>

properties:
  compatible:
    const: qst,qmc6308

  reg:
    maxItems: 1

  mount-matrix:
    description: An optional 3x3 mounting rotation matrix.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        magnetometer@2c {
            compatible = "qst,qmc6308";
            reg = <0x2c>;
        };
    };
