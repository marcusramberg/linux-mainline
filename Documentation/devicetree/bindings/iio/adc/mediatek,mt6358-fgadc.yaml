%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/mediatek,mt6358-fgadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6358 PMIC fuel gauge ADC

maintainers:
  - Marcus Ramberg <marcus@means.no>

description:
  The fuel gauge ADC (FGADC) of the MT6358 PMIC measures the battery
  current across an external sense resistor.

properties:
  compatible:
    const: mediatek,mt6358-fgadc

  "#io-channel-cells":
    const: 0

  shunt-resistor-micro-ohms:
    description: Value of the battery current sense resistor.

required:
  - compatible
  - "#io-channel-cells"
  - shunt-resistor-micro-ohms

additionalProperties: false
