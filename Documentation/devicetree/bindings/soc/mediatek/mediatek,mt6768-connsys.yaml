%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6768-connsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6768 connectivity subsystem (CONNSYS)

maintainers:
  - Marcus Ramberg <marcus@means.no>

description:
  CONNSYS holds Bluetooth, Wi-Fi, GPS and FM, which share one MCU and the
  MT6631 RF die (A-die). The MCU runs from host memory, which infracfg
  maps into its address space; the host reaches it over BTIF. The
  Bluetooth node under BTIF refers to this node, see
  Documentation/devicetree/bindings/net/bluetooth/mediatek,mt6768-bluetooth.yaml.

properties:
  compatible:
    const: mediatek,mt6768-connsys

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: BTIF wakeup, raised when the MCU has data for the host
      - description: MCU software interrupt

  interrupt-names:
    items:
      - const: wakeup
      - const: sw

  mediatek,infracfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: infracfg_ao, which maps memory-region and pericfg into
      the MCU's address space.

  memory-region:
    maxItems: 1
    description: Memory the MCU runs from. It must be aligned to 16 MiB,
      the granularity of the mapping.

  power-domains:
    maxItems: 1

  resets:
    items:
      - description: MCU reset
      - description: Subsystem reset

  reset-names:
    items:
      - const: cpu
      - const: sw

  vcn18-supply:
    description: 1.8 V supply of the subsystem and the A-die.

  vcn28-supply:
    description: 2.8 V A-die supply, needed while the A-die calibrates.

  vcn33-supply:
    description: 3.3 V supply of the Bluetooth and Wi-Fi RF front ends.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - mediatek,infracfg
  - memory-region
  - power-domains
  - resets
  - reset-names
  - vcn18-supply
  - vcn28-supply
  - vcn33-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/mt8183-resets.h>

    connectivity@18000000 {
        compatible = "mediatek,mt6768-connsys";
        reg = <0x18000000 0x100000>;
        interrupts = <GIC_SPI 284 IRQ_TYPE_LEVEL_LOW>,
                     <GIC_SPI 287 IRQ_TYPE_EDGE_FALLING>;
        interrupt-names = "wakeup", "sw";
        mediatek,infracfg = <&infracfg_ao>;
        memory-region = <&connsys_mem>;
        power-domains = <&spm 1>;
        resets = <&toprgu MT8183_TOPRGU_CONN_MCU_SW_RST>,
                 <&toprgu MT8183_TOPRGU_CONN_SW_RST>;
        reset-names = "cpu", "sw";
        vcn18-supply = <&mt6358_vcn18_reg>;
        vcn28-supply = <&mt6358_vcn28_reg>;
        vcn33-supply = <&mt6358_vcn33_reg>;
    };
