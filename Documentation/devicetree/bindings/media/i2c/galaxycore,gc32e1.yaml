%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc32e1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC32E1 CMOS Image Sensor

maintainers:
  - Marcus Ramberg <marcus@means.no>

description:
  The GalaxyCore GC32E1 is a 32 megapixel (6528x4896) CMOS image sensor
  controlled over I2C, with a four lane MIPI CSI-2 D-PHY output.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc32e1

  reg:
    maxItems: 1

  clocks:
    description: Input clock (24 MHz)
    maxItems: 1

  avdd-supply:
    description: Analog power supply (2.8 V)

  dovdd-supply:
    description: Interface power supply (1.8 V)

  dvdd-supply:
    description: Digital core power supply (1.2 V)

  reset-gpios:
    description: Sensor reset GPIO
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@4a {
            compatible = "galaxycore,gc32e1";
            reg = <0x4a>;
            clocks = <&camera_mclk>;
            reset-gpios = <&pio 109 GPIO_ACTIVE_LOW>;
            avdd-supply = <&vcama2>;
            dovdd-supply = <&vcamio>;
            dvdd-supply = <&cam_dvdd>;

            port {
                endpoint {
                    remote-endpoint = <&csi2_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <403200000>;
                };
            };
        };
    };
...
