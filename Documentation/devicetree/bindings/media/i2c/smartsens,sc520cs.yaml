%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc520cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC520CS CMOS Image Sensor

maintainers:
  - Marcus Ramberg <marcus@means.no>

description:
  The SmartSens SC520CS is a 5 megapixel (2592x1944) RAW10 CMOS image sensor
  controlled over I2C, with a two lane MIPI CSI-2 D-PHY output.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: smartsens,sc520cs

  reg:
    maxItems: 1

  clocks:
    description: Input clock (24 MHz)
    maxItems: 1

  avdd-supply:
    description: Analog power supply (2.8 V)

  dovdd-supply:
    description: Interface power supply (1.8 V)

  dvdd-supply:
    description: Digital core power supply (1.2 V)

  reset-gpios:
    maxItems: 1

  powerdown-gpios:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dovdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@36 {
            compatible = "smartsens,sc520cs";
            reg = <0x36>;
            clocks = <&camera_mclk>;
            reset-gpios = <&pio 102 GPIO_ACTIVE_LOW>;
            avdd-supply = <&vcama2>;
            dovdd-supply = <&vcamio>;
            dvdd-supply = <&cam_dvdd>;

            port {
                endpoint {
                    remote-endpoint = <&csi1_ep>;
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <450000000>;
                };
            };
        };
    };
...
